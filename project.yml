name: Memorable
options:
  bundleIdPrefix: com.blockdeep
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    from: "1.28.0"
targets:
  Memorable:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Build.xcconfig
      Release: Config/Build.xcconfig
    sources:
      - path: Memorable
        excludes:
          - "Models/**"
      - path: Memorable/Models/SigLIP2_ImageEncoder.mlmodelc
        type: folder
        buildPhase: resources
      - path: Memorable/Models/SigLIP2_TextEncoder.mlmodelc
        type: folder
        buildPhase: resources
    resources:
      - path: Memorable/Resources
    dependencies:
      - package: GRDB
      - package: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blockdeep.memorable
        INFOPLIST_FILE: Memorable/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Memorable
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "8"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
  MemorableTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Build.xcconfig
      Release: Config/Build.xcconfig
    sources:
      - path: MemorableTests
    dependencies:
      - target: Memorable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blockdeep.memorable.tests
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Memorable.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Memorable"
        BUNDLE_LOADER: "$(TEST_HOST)"
  MemorableRelevanceTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Build.xcconfig
      Release: Config/Build.xcconfig
    sources:
      - path: MemorableRelevanceTests
    resources:
      - path: MemorableRelevanceTests/Fixtures
    dependencies:
      - target: Memorable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blockdeep.memorable.relevance-tests
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Memorable.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Memorable"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Memorable:
    build:
      targets:
        Memorable: all
        MemorableTests: [test]
    run:
      config: Release
    test:
      config: Debug
      targets:
        - MemorableTests
    archive:
      config: Release
  MemorableRelevanceTests:
    build:
      targets:
        Memorable: all
        MemorableRelevanceTests: [test]
    test:
      config: Debug
      targets:
        - MemorableRelevanceTests
      environmentVariables:
        MEMORABLE_RELEVANCE_PERTURBATION: "$(MEMORABLE_RELEVANCE_PERTURBATION)"
        MEMORABLE_RELEVANCE_SKIP_BASELINE: "$(MEMORABLE_RELEVANCE_SKIP_BASELINE)"
