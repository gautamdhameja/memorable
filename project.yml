name: Memorable
options:
  bundleIdPrefix: com.blockdeep
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
targets:
  Memorable:
    type: application
    platform: iOS
    sources:
      - path: Memorable
        excludes:
          - "Models/**"
      - path: Memorable/Models/MobileCLIP2_S4_ImageEncoder.mlmodelc
        type: folder
        buildPhase: resources
        resourceTags: [ml-models]
      - path: Memorable/Models/MobileCLIP2_S4_TextEncoder.mlmodelc
        type: folder
        buildPhase: resources
        resourceTags: [ml-models]
    resources:
      - path: Memorable/Resources
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blockdeep.memorable
        INFOPLIST_FILE: Memorable/Info.plist
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
  MemorableTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MemorableTests
    dependencies:
      - target: Memorable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blockdeep.memorable.tests
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Memorable.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Memorable"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Memorable:
    build:
      targets:
        Memorable: all
        MemorableTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MemorableTests
    archive:
      config: Release
